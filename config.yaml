project:
  name: "WD1145 Interloper\u2013Debris Disk Monte Carlo"
  version: 0.2.0
  description: 'Monte Carlo simulation for an inclined interloper crossing a rectangular-thickness
    debris annulus around WD1145.

    '
constants:
  G: 6.6743e-11
  M_sun_kg: 1.98847e30
  M_earth_kg: 5.9722e24
  earth_diameter_km: 12742.0
  day_s: 86400
  au_m: 1.495978707e11
system:
  wd_mass_msun: 0.6
  wd_diameter_earth: 1.3
  period_days: 125.0
  eccentricity: 0.9875229291235744
  interloper_mass_mearth: 0.00016
  interloper_radius_km: 5.0
  perigee_speed_km_s: 135.0
  inclination_deg: 0.0
  delta_z_wd_radii: 0.1
disk:
  geometry: flat_coplanar_annulus_rectangular_thickness_perigee
  r_in_wd_radii: 89.98151479661446
  r_out_wd_radii: 96.01848520338554
  thickness_wd_radii: 0.1207394081354213
  initial_fragment_count: 5000000
  fragment_bins:
  - diameter_m: 10.0
    count: 1700000
  - diameter_m: 25.0
    count: 1600000
  - diameter_m: 50.0
    count: 1700000
  psd_slope_q0: 3.0
  fragment_delta_v_km_s: 100.0
collision:
  cross_section: geometric
  relative_velocity:
    mode: gaussian
    center_km_s: 100.0
    sigma_km_s: 15.0
  fragmentation_efficiency: 0.2
  impulse_efficiency: 0.02
activity:
  scatter_duration_years: 4.5
  decay_mode: exponential
  decay_tau_years: 2.0
  local_rate_boost_initial: 2.0
  psd_stochastic_sigma: 0.2
  event_every_years: 4.0
  event_duration_orbits: 1
  event_collision_boost: 8.0
sublimation:
  enabled: true
  S0_kg_s: 1000.0
  length_scale_m: 2.0e8
  cutoff_radius_m: 2.0e9
  da_dt_scale_au_per_yr: -1.0e-07
  de_dt_scale_per_yr: -1.0e-07
integration:
  duration_years: 20.0
  random_seed: 1145
  monte_carlo_runs: 100
outputs:
  directory: outputs
  save_event_catalog: true
  save_orbital_history: true
  save_observables: true
